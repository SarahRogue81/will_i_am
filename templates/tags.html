{% extends "base.html" %}
{% block title %}Tags | {{ SITENAME }}{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/tags.css"/>{% endblock %}
{% block content %}
<article class="card">
    <h1>Tags</h1>
    <ul class="term-list">
        {% for tag, tag_articles in tags | sort %}
        <li><a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }}</a> <span>{{ tag_articles | count }}</span></li>
        {% endfor %}
    </ul>
</article>
{% endblock %}
