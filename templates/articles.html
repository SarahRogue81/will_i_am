{% extends "base.html" %}
{% block title %}{% block heading %}Blog{% endblock %} | {{ SITENAME }}{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/articles.css"/>{% endblock %}
{% block content %}
<section class="card">
    <h1>{{ self.heading() }}</h1>
    <ul class="post-list">
        {% for a in articles %}
        <li>
            <a href="{{ SITEURL }}/{{ a.url }}">{{ a.title }}</a>
            <time datetime="{{ a.date.isoformat() }}">{{ a.date.strftime('%-d %b') }}</time>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
