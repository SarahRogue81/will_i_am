{% extends "base.html" %}
{% block title %}Categories | {{ SITENAME }}{% endblock %}
{% block css %}<link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/categories.css"/>{% endblock %}
{% block content %}
<article class="card">
    <h1>Categories</h1>
    <ul class="term-list">
        {% for category, cat_articles in categories | sort %}
        <li><a href="{{ SITEURL }}/{{ category.url }}">{{ category }}</a> <span>{{ cat_articles | count }}</span></li>
        {% endfor %}
    </ul>
</article>
{% endblock %}
